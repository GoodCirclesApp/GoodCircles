# CI for the marketplace app + backend (everything except the marketing site,
# which has its own gate in marketing-seo.yml). The backend auto-deploys to
# Railway on push to main, so this is the safety net that runs BEFORE that:
# typecheck the whole app, run the DB-free test suite, and report npm audit.
name: app-ci

on:
  push:
    branches: [main]
    paths-ignore: ['marketing/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['marketing/**', 'docs/**', '**/*.md']

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma client is needed for the server to typecheck.
      - run: npx prisma generate
      # Whole-project typecheck — the same gate the Dockerfile build uses (tsc --noEmit).
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      # Report-only strict typecheck: surfaces the strict-mode baseline without
      # failing the build. Burn it down per docs/ts-strict-burndown.md, then make
      # this blocking (drop the `|| true`) once it reaches zero.
      - name: TypeScript strict (report-only)
        run: npx tsc --noEmit -p tsconfig.strict.json || true
      # DB-free unit tests (pure money-math + webhook handler). The PrismaClient-backed
      # suites (auth/wallet/netting/communityFund/cooperative) need a Postgres service
      # container — add that to graduate them into CI (tracked in P2).
      - name: Unit tests (no DB)
        run: npx vitest run server/src/tests/transaction.test.ts server/src/tests/emailWebhook.test.ts
      # Report-only for now (lockfile refresh + fixes tracked in P2). Tighten to a
      # failing gate once the high-severity transitive vulns are resolved.
      - name: npm audit (report-only)
        run: npm audit --omit=dev --audit-level=high || true
